name: Build and Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: osmAndCompanion

      - name: Build with Gradle
        run: ./gradlew assembleDebug
        working-directory: osmAndCompanion

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: osmAndCompanion-debug
          path: osmAndCompanion/build/outputs/apk/debug/*.apk

  pebble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Pebble app
        run: |
          docker run --rm -v ${{ github.workspace }}:/pebble -w /pebble/pebbleApp rebble/pebble-sdk pebble build

      - name: Upload PBW
        uses: actions/upload-artifact@v4
        with:
          name: pebbleApp-pbw
          path: pebbleApp/build/*.pbw

  release:
    needs: [android, pebble]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: osmAndCompanion-debug
          path: release-artifacts

      - name: Download Pebble artifact
        uses: actions/download-artifact@v4
        with:
          name: pebbleApp-pbw
          path: release-artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release-artifacts/*.apk
            release-artifacts/*.pbw
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
